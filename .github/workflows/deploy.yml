name: CI/CD Pipeline

on:
  push:
    branches:
      - Master  # change if your main branch has a different name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push App image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/driving_bot_app:latest ./ 
          docker push ${{ secrets.DOCKER_USERNAME }}/driving_bot_app:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/agrawalraj918/Projects/driving_bot
            docker pull ${{ secrets.DOCKER_USERNAME }}/driving_bot_app:latest
            docker compose -f docker-compose.yml up -d
