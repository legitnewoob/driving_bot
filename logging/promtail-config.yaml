# ./logging/promtail-config.yaml

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    # This relabeling part is the key change.
    # It no longer has a rule to 'keep' only one container.
    # Instead, it just creates useful labels for ALL containers.
    relabel_configs:
      # Creates a 'container' label with the clean name (e.g., "driving_bot_nginx")
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Creates a 'service' label from the docker-compose service name (e.g., "nginx")
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'