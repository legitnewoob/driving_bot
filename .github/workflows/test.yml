name: Tests

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (unit + integration, excluding e2e)
        run: npx jest --verbose --testPathIgnorePatterns=tests/e2e
        env:
          NODE_ENV: test
          GOOGLE_MAPS_API_KEY: test-key
          APP_TIMEZONE: Europe/London
