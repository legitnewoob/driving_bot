version: "3.9"
services:
  app:
    build: .
    container_name: driving_bot_app
    restart: always
    ports:
      - "3000"

  nginx:
    image: nginx:latest
    container_name: driving_bot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro