name: Auto Promote Branches

on:
  push:
    branches:
      - Development
      - UAT

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR Development → UAT
        if: github.ref == 'refs/heads/Development'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: Development
          destination_branch: UAT
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Auto Promotion: Development → UAT"
          pr_body: "Automated promotion from Development to UAT"

      - name: Create PR UAT → Master
        if: github.ref == 'refs/heads/UAT'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: UAT
          destination_branch: Master
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "Auto Promotion: UAT → Master"
          pr_body: "Automated promotion from UAT to Master"